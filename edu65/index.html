<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edu cumple 65</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
<!--OG-->
<meta property="og:title" content="Edu cumple 65 🎉">
<meta property="og:description" content="Cuenta regresiva al 2 de noviembre · Una foto cada día">
<meta property="og:type" content="website">
<meta property="og:image" content="https://tomdosfre.github.io/temp_stuff/edu65/fotos/10-23.jpg">
<meta name="twitter:card" content="summary_large_image">
<!--/OG-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0f172a; --muted:#64748b; --blue:#2b7fd6; --orange:#f59e0b; --bg:#f5f7fb; --card:#fff; --line:#e5e9f0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:Inter, system-ui, sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; padding:max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); gap:12px; justify-content:center; }
  header { text-align:center; flex:none; }
  .kicker { font-size:11px; font-weight:800; letter-spacing:.14em; color:var(--blue); text-transform:uppercase; }
  .kicker span { color:var(--muted); letter-spacing:0; text-transform:none; font-weight:600; }
  h1 { font-size:clamp(34px, 11vw, 64px); font-weight:900; letter-spacing:-.04em; line-height:1.05; margin-top:6px; }
  .badge { display:inline-block; background:linear-gradient(135deg,#38a0f0,#2f5cf0); color:#fff; padding:0 .22em; border-radius:.2em; transform:rotate(-3deg); box-shadow:0 6px 18px rgba(47,92,240,.3); }
  .sub { font-size:13px; color:var(--muted); margin-top:6px; }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; flex:none; }
  .tile { background:var(--card); border-radius:14px; padding:10px 4px 8px; text-align:center; box-shadow:0 2px 10px rgba(15,23,42,.06); }
  .num { font:700 clamp(24px,8vw,40px)/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tile:first-child .num { color:var(--blue); }
  .tile:last-child .num { color:var(--orange); }
  .lbl { font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--muted); margin-top:4px; }
  .prog { flex:none; }
  .row { display:flex; justify-content:space-between; align-items:center; font-size:11px; font-weight:600; color:var(--muted); }
  .row button { border:0; background:none; font:inherit; font-weight:700; color:var(--blue); cursor:pointer; padding:4px; }
  .bar { height:6px; background:var(--line); border-radius:99px; margin-top:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#2f5cf0,#38a0f0 70%,var(--orange)); border-radius:99px; }
  .photo { flex:0 1 auto; min-height:0; display:flex; justify-content:center; }
  .note { flex:none; background:var(--card); border-radius:14px; padding:12px 14px; font-size:15px; line-height:1.4; text-align:center; box-shadow:0 2px 10px rgba(15,23,42,.06); }
  .note i { font-style:normal; font-weight:700; color:var(--blue); display:inline-block; transition:filter .3s; }
  .note.hide i { filter:blur(6px); }
  .note.hide::after { content:'👆 Tocá para ver el remate'; display:block; font-size:11px; color:var(--muted); margin-top:4px; }
  .note { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .note b { display:block; font-size:10px; letter-spacing:.14em; color:var(--blue); margin-bottom:4px; }
  .note:empty { display:none; }
  .photo img { max-width:100%; max-height:100%; width:auto; height:auto; display:block; border-radius:18px; box-shadow:0 8px 28px rgba(15,23,42,.18); }
  body.bday .tiles, body.bday .prog { display:none; }
  .wa { flex:none; align-self:center; display:inline-flex; align-items:center; gap:6px; background:#25d366; color:#fff; font-size:13px; font-weight:700; text-decoration:none; padding:8px 16px; border-radius:99px; box-shadow:0 2px 10px rgba(37,211,102,.35); }
  canvas { position:fixed; inset:0; pointer-events:none; z-index:9; }
</style>
</head>
<body>
<header>
  <div class="kicker">Cuenta regresiva oficial <span>· 2 de noviembre</span></div>
  <h1 id="title">Edu cumple <span class="badge">65</span></h1>
  <div class="sub" id="sub">Una foto distinta cada día</div>
</header>
<section class="tiles">
  <div class="tile"><div class="num" id="d">--</div><div class="lbl">DÍAS</div></div>
  <div class="tile"><div class="num" id="h">--</div><div class="lbl">HORAS</div></div>
  <div class="tile"><div class="num" id="m">--</div><div class="lbl">MIN</div></div>
  <div class="tile"><div class="num" id="s">--</div><div class="lbl">SEG</div></div>
</section>
<section class="prog">
  <div class="row"><span>10 de octubre</span><button id="conf">🎉 ¡Tirar papelitos!</button><span>2 de nov (65)</span></div>
  <div class="bar"><i id="bar" style="width:0"></i></div>
</section>
<figure class="photo"><img id="img" alt="Foto del día"></figure>
<div class="note" id="note"></div>
<a class="wa" id="wa" href="#">📸 Compartir la foto del día</a>
<canvas id="cv"></canvas>
<script>
const TZ = 'America/Argentina/Buenos_Aires';
const START = Date.parse('2026-10-10T00:00:00-03:00');
const END = Date.parse('2026-11-02T00:00:00-03:00');
const NOTES = {"10-15": "<b>UN DÍA COMO HOY, EN 1961…</b>Racing empataba 1–1 con Chacarita, camino al título de campeón de 1961.", "10-22": "<b>UN DÍA COMO HOY, EN 1961…</b>Racing le ganaba 5–0 a Lanús en el Cilindro, camino al título.", "10-29": "<b>UN DÍA COMO HOY, EN 1961…</b>Racing sacaba un 1–1 en el Monumental contra River, camino al título.", "11-01": "<b>UN DÍA COMO HOY, EN 1961…</b>El mundo se preparaba para recibir a Edu. Por las dudas, Racing le ganaba 2–0 a Atlanta.", "10-10": "<b>EL CHISTE DEL DÍA</b>¿Qué le dice un techo a otro techo?<br><i>Techo de menos.</i>", "10-11": "<b>EL CHISTE DEL DÍA</b>¿Por qué el libro de matemáticas está triste?<br><i>Porque tiene muchos problemas.</i>", "10-12": "<b>EL CHISTE DEL DÍA</b>¿Qué hace una abeja en el gimnasio?<br><i>¡Zum-ba!</i>", "10-13": "<b>EL CHISTE DEL DÍA</b>Mozo, hay una mosca en mi sopa.<br><i>Tranquilo, señor, no come mucho.</i>", "10-14": "<b>EL CHISTE DEL DÍA</b>¿Cuál es el colmo de un jardinero?<br><i>Que lo dejen plantado.</i>", "10-16": "<b>EL CHISTE DEL DÍA</b>¿Qué le dijo el 0 al 8?<br><i>Lindo cinturón.</i>", "10-17": "<b>EL CHISTE DEL DÍA</b>¿Cómo se despiden los químicos?<br><i>Ácido un placer.</i>", "10-18": "<b>EL CHISTE DEL DÍA</b>¿Qué le dice una iguana a su hermana gemela?<br><i>Somos iguanitas.</i>", "10-19": "<b>EL CHISTE DEL DÍA</b>¿Cuál es el café más peligroso del mundo?<br><i>El ex-preso.</i>", "10-20": "<b>EL CHISTE DEL DÍA</b>¿Qué le dice una impresora a otra?<br><i>¿Esa hoja es tuya o es impresión mía?</i>", "10-21": "<b>EL CHISTE DEL DÍA</b>¿Qué hace un perro con un taladro?<br><i>Taladrando.</i>", "10-23": "<b>EL CHISTE DEL DÍA</b>¿Cómo se dice pañuelo en japonés?<br><i>Saka-moko.</i>", "10-24": "<b>EL CHISTE DEL DÍA</b>¿Cuál es el colmo de un electricista?<br><i>Que su mujer se llame Luz y los hijos le sigan la corriente.</i>", "10-25": "<b>EL CHISTE DEL DÍA</b>¿Qué le dijo una uva verde a una uva morada?<br><i>¡Respirá, respirá!</i>", "10-26": "<b>EL CHISTE DEL DÍA</b>¿Qué le dice un pez a otro pez?<br><i>Nada.</i>", "10-27": "<b>EL CHISTE DEL DÍA</b>¿Cuál es el animal más antiguo?<br><i>La cebra, porque está en blanco y negro.</i>", "10-28": "<b>EL CHISTE DEL DÍA</b>¿Qué le dijo la luna al sol?<br><i>Tan grande y no te dejan salir de noche.</i>", "10-30": "<b>EL CHISTE DEL DÍA</b>¿Por qué el tomate no toma té?<br><i>Porque es tomate.</i>", "10-31": "<b>EL CHISTE DEL DÍA</b>—Papá, ¿qué se siente tener un hijo tan lindo?<br><i>—No sé, preguntale a tu abuelo.</i>"};
const pad = n => String(n).padStart(2, '0');
function arDay() {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  return p.find(x => x.type === 'month').value + '-' + p.find(x => x.type === 'day').value;
}
function setPhoto() {
  let key = arDay();
  if (key < '10-10' || key > '11-02') key = key > '11-02' && key < '12-31' ? '11-02' : '10-10';
  const src = 'fotos/' + key + '.jpg';
  if (img.dataset.want === key) return;
  img.dataset.want = key; note.innerHTML = NOTES[key] || ''; note.classList.toggle('hide', !!note.querySelector('i')); img.src = src;
}
function tick() {
  const now = Date.now(), left = END - now;
  if (left <= 0) {
    document.body.classList.add('bday');
    title.innerHTML = '¡Feliz cumple, Edu! <span class="badge">65</span>';
    sub.textContent = '2 de noviembre de 2026';
    if (!tick.done) { tick.done = 1; confetti(); }
  } else {
    const t = Math.floor(left / 1000);
    d.textContent = pad(Math.floor(t / 86400));
    h.textContent = pad(Math.floor(t % 86400 / 3600));
    m.textContent = pad(Math.floor(t % 3600 / 60));
    s.textContent = pad(t % 60);
    bar.style.width = Math.min(100, Math.max(2, (now - START) / (END - START) * 100)) + '%';
  }
  setPhoto();
}
tick(); setInterval(tick, 1000);

function confetti() {
  const c = cv, x = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ['#2f5cf0', '#38a0f0', '#f59e0b', '#ef4444', '#10b981', '#ec4899'];
  const ps = Array.from({ length: 160 }, () => ({ x: W / 2, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: cols[Math.random() * cols.length | 0], a: Math.random() * 6, va: (Math.random() - .5) * .3 }));
  let f = 0;
  (function loop() {
    x.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (++f < 200) requestAnimationFrame(loop); else x.clearRect(0, 0, W, H);
  })();
}
conf.onclick = confetti;
function shareText() {
  const n = Math.max(0, Math.floor((END - Date.now()) / 86400000));
  return n === 0 ? '¡Hoy es el cumple de Edu! Acá está la foto del día' : n + (n === 1 ? ' día' : ' días') + ' para el cumple de Edu! Acá está la foto del día';
}
wa.onclick = async e => {
  e.preventDefault();
  const text = shareText();
  try {
    const blob = await (await fetch(img.src)).blob();
    const file = new File([blob], 'edu65-' + img.dataset.want + '.jpg', { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
  } catch (err) { if (err.name === 'AbortError') return; }
  open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + img.src), '_blank');
};
note.onclick = () => { if (note.classList.contains('hide')) { note.classList.remove('hide'); confetti(); } };
img.onerror = () => { if (!img.src.endsWith('11-01.jpg')) { img.src = 'fotos/11-01.jpg'; } };
</script>
</body>
</html>

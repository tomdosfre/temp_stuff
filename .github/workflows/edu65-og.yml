name: edu65 daily preview
on:
  schedule:
    - cron: '1 3 * * *'   # 00:01 Argentina (UTC-3)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point og:image at today's photo
        run: |
          K=$(TZ=America/Argentina/Buenos_Aires date +%m-%d)
          [[ "$K" < "10-10" ]] && K=10-10
          [[ "$K" > "11-02" ]] && K=11-02
          [ -f "edu65/fotos/$K.jpg" ] || K=11-01
          sed -i -E "s#(edu65/fotos/)[0-9]{2}-[0-9]{2}\.jpg#\1$K.jpg#" edu65/index.html
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git diff --quiet || (git commit -am "edu65: preview $K" && git push)

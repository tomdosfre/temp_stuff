<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Comparador de propiedades: se mudó</title>
<style>
:root{color-scheme:light}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fb;color:#1f2933;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
main{max-width:420px;display:grid;gap:14px;text-align:center}
h1{font-size:22px;font-weight:600;margin:0}
a.btn{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#1967d2;color:#fff;text-decoration:none;font-weight:600}
p{margin:0;color:#5f6b7a;font-size:14px}
p a{color:#1967d2}
</style>
</head>
<body>
<main>
  <h1>El comparador se mudó al Hub</h1>
  <a class="btn" id="go" href="https://hub.mentoliptus.com/propiedades">Abrir en el Hub</a>
</main>
<script>
/* Your numbers lived in this browser under this address. Every visit sends them to the Hub in the #fragment
   (the fragment never reaches any server); the Hub stores each copy once, so nothing you change there is overwritten. */
(function(){
  const HUB = 'https://hub.mentoliptus.com/propiedades', KEY = 'comparador-propiedades-v1';
  let raw = null; try { raw = localStorage.getItem(KEY); } catch(e) {}
  if (!raw) { location.replace(HUB + (/[?&]traer=1/.test(location.search) ? '#sin-datos' : '')); return; }
  const b = btoa(String.fromCharCode(...new TextEncoder().encode(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  document.getElementById('go').href = HUB + '#importar=' + b;
  location.replace(HUB + '#importar=' + b);
})();
</script>
</body>
</html>
